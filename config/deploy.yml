# Production server: 5.223.44.132 ("moab"). All apps are consolidated onto this
# single Hetzner box. 5.223.48.42, 5.223.51.74 and 5.223.54.207 are DECOMMISSIONED
# — an SSH host-key warning for any of them is expected, not a compromise.

service: noshi

image: moab/noshi

ssh:
  user: root

servers:
  web:
  - 5.223.44.132

proxy:
  ssl:
    certificate_pem: <%= ENV['CLOUDFLARE_SSL_CERT_PEM'] %>
    private_key_pem: <%= ENV['CLOUDFLARE_SSL_KEY_PEM'] %>
  host: noshi.moab.jp
  app_port: 80
  forward_headers: true
  healthcheck:
    path: /up
    interval: 10
    timeout: 30

registry:
  server: 047719641231.dkr.ecr.ap-southeast-2.amazonaws.com
  username: AWS
  password:
  - AWS_ECR_PASSWORD

# Persistent storage for the SQLite database and ActiveStorage uploads
# (saved noshi + community backgrounds). Survives deploys/restarts.
volumes:
  - "noshi_storage:/rails/storage"

env:
  secret:
  - SECRET_KEY_BASE
  - CLOUDFLARE_SSL_CERT_PEM
  - CLOUDFLARE_SSL_KEY_PEM
  # OAuth (Google) + billing (Stripe). Populate in .kamal/secrets.
  - GOOGLE_CLIENT_ID
  - GOOGLE_CLIENT_SECRET
  - STRIPE_SECRET_KEY
  - STRIPE_PUBLISHABLE_KEY
  - STRIPE_WEBHOOK_SECRET
  - STRIPE_MONTHLY_PRICE_ID
  - STRIPE_YEARLY_PRICE_ID
  clear:
    # config/puma.rb defaults to 4 workers; the shared host has 2 cores.
    WEB_CONCURRENCY: 1

# Builds run locally with Docker on this machine. This host is arm64 and the
# servers are amd64, so buildx cross-builds via emulation.
builder:
  arch: amd64
  # Docker 29 buildx attaches provenance/SBOM attestations by default and the
  # private ECR registry 403s on those blobs. Keep both off.
  provenance: false
  sbom: false

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
