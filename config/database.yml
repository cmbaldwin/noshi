# SQLite, stored on disk. In production the storage/ directory is a Kamal
# persistent volume (see config/deploy.yml), so the database survives deploys.
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  <<: *default
  # storage/ is the mounted Kamal volume in production.
  database: storage/production.sqlite3
